<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COREMERCH</title>
  <meta name="description" content="Sovereign commerce infrastructure for digital creators." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:  #07080F;
      --navy:   #0C1220;
      --teal:   #00BDB3;
      --amber:  #F0A500;
      --white:  #F4F6FA;
      --muted:  #6B7280;
      --border: rgba(0, 189, 179, 0.12);
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 17px;
      line-height: 1.75;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 8, 15, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--white);
      text-decoration: none;
    }

    .nav-brand span { color: var(--teal); }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--teal); }

    /* ── ARTICLE ── */
    .article-wrap {
      max-width: 740px;
      margin: 0 auto;
      padding: 48px 24px 100px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--teal);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 36px;
      transition: opacity 0.2s;
    }

    .back-link:hover { opacity: 0.75; }

    /* Hero image */
    .hero-img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 36px;
      display: block;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: var(--navy);
    }

    /* Post meta */
    .post-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .post-category {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--teal);
      background: rgba(0,189,179,0.08);
      padding: 4px 12px;
      border-radius: 12px;
    }

    .post-type {
      font-size: 12px;
      color: var(--muted);
      text-transform: capitalize;
    }

    .post-date {
      font-size: 13px;
      color: var(--muted);
      margin-left: auto;
    }

    /* Title */
    .post-title {
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.5px;
      margin-bottom: 28px;
    }

    /* Content blocks */
    .content-paragraph {
      color: #C9CDD6;
      margin-bottom: 24px;
      font-size: 17px;
      line-height: 1.78;
    }

    .content-heading {
      font-size: 22px;
      font-weight: 700;
      color: var(--white);
      margin: 44px 0 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .content-callout {
      background: rgba(0,189,179,0.06);
      border-left: 3px solid var(--teal);
      border-radius: 0 8px 8px 0;
      padding: 16px 20px;
      margin: 28px 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--teal);
      line-height: 1.5;
    }

    /* CTA block */
    .content-cta {
      background: var(--navy);
      border: 1px solid rgba(0,189,179,0.25);
      border-radius: 12px;
      padding: 28px;
      margin: 44px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cta-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--teal);
    }

    .cta-product {
      font-size: 20px;
      font-weight: 800;
      color: var(--white);
    }

    .cta-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    .cta-btn {
      display: inline-block;
      background: var(--teal);
      color: var(--black);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.2s;
      align-self: flex-start;
    }

    .cta-btn:hover { opacity: 0.85; }

    /* Divider */
    .post-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 48px 0;
    }

    /* Related */
    .related-section {
      margin-top: 60px;
    }

    .related-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--white);
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .related-card {
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }

    .related-card:hover { border-color: rgba(0,189,179,0.35); }

    /* State */
    .state-wrap {
      text-align: center;
      padding: 80px 24px;
    }

    .state-icon { font-size: 48px; display: block; margin-bottom: 20px; }
    .state-title { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    .state-sub { font-size: 15px; color: var(--muted); margin-bottom: 24px; }

    .state-btn {
      display: inline-block;
      background: var(--teal);
      color: var(--black);
      font-size: 14px;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 8px;
      text-decoration: none;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 32px 24px;
      text-align: center;
    }

    .footer-brand {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .footer-brand span { color: var(--teal); }
    .footer-sub { font-size: 13px; color: var(--muted); }

    @media (max-width: 640px) {
      .nav-links { display: none; }
      .post-date { margin-left: 0; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-brand">CORE<span>MERCH</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="posts.html">Blog</a></li>
      <li><a href="freebies.html">Free</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="article-wrap" id="articleWrap">
    <div class="state-wrap">
      <span class="state-icon">⟳</span>
      <div class="state-title">Loading post...</div>
      <div class="state-sub">Fetching content from the infrastructure layer.</div>
    </div>
  </div>

  <footer>
    <div class="footer-brand">CORE<span>MERCH</span></div>
    <div class="footer-sub">Core infrastructure for digital commerce.</div>
  </footer>

<script>
// ============================================================
// COREMERCH Post Reader — post.html
// Reads posts/data/{postId}.json
// ============================================================

var DATA_BASE  = 'posts/data/';
var SHOP_URL   = 'products.html';
var INDEX_URL  = 'index.json';

function getPostId() {
  var params = new URLSearchParams(window.location.search);
  return params.get('id') || '';
}

function formatDate(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleDateString('en-US', {
      year: 'numeric', month: 'long', day: 'numeric'
    });
  } catch (e) { return ''; }
}

function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ------------------------------------------------------------
// Load + render post
// ------------------------------------------------------------
function loadPost() {
  var postId = getPostId();
  if (!postId) { showError('No post ID specified.'); return; }

  var url = DATA_BASE + postId + '.json?v=' + Date.now();

  fetch(url)
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (post) {
      document.title = (post.title || 'Post') + ' — COREMERCH';
      renderPost(post);
      if (post.related && post.related.length) loadRelated(post.related);
    })
    .catch(function (err) {
      showError(err.message);
    });
}

// ------------------------------------------------------------
// Render post
// ------------------------------------------------------------
function renderPost(post) {
  var wrap = document.getElementById('articleWrap');
  var html = '';

  // Back link
  html += '<a href="posts.html" class="back-link">← Back to Blog</a>';

  // Hero image
  if (post.image) {
    html += '<img class="hero-img" src="' + escapeHtml(post.image) +
            '" alt="' + escapeHtml(post.title) + '" />';
  }

  // Meta
  html += '<div class="post-meta">';
  if (post.category) {
    html += '<span class="post-category">' + escapeHtml(post.category) + '</span>';
  }
  if (post.contentType) {
    html += '<span class="post-type">' + escapeHtml(post.contentType) + '</span>';
  }
  html += '<span class="post-date">' + formatDate(post.date) + '</span>';
  html += '</div>';

  // Title
  html += '<h1 class="post-title">' + escapeHtml(post.title || '') + '</h1>';

  // Content blocks
  if (post.content && post.content.length) {
    post.content.forEach(function (block) {
      if (!block || !block.type) return;

      if (block.type === 'paragraph') {
        html += '<p class="content-paragraph">' +
                escapeHtml(block.text || '') + '</p>';

      } else if (block.type === 'heading') {
        html += '<h2 class="content-heading">' +
                escapeHtml(block.text || '') + '</h2>';

      } else if (block.type === 'callout') {
        html += '<div class="content-callout">' +
                escapeHtml(block.text || '') + '</div>';

      } else if (block.type === 'cta') {
        html += '<div class="content-cta">';
        html += '<div class="cta-label">Featured Infrastructure</div>';
        html += '<div class="cta-product">' +
                escapeHtml(block.product || '') + ' — ' +
                escapeHtml(block.price || '') + '</div>';
        html += '<div class="cta-desc">' + escapeHtml(block.text || '') + '</div>';
        html += '<a href="' + escapeHtml(block.url || SHOP_URL) +
                '" class="cta-btn">View Product →</a>';
        html += '</div>';
      }
    });
  }

  html += '<hr class="post-divider" />';

  // Author / source line
  html += '<p style="font-size:13px;color:var(--muted);">Published by ' +
          escapeHtml(post.author || 'COREMERCH') +
          (post.date ? ' · ' + formatDate(post.date) : '') +
          '</p>';

  // Related placeholder — filled by loadRelated()
  html += '<div id="relatedSection"></div>';

  wrap.innerHTML = html;
}

// ------------------------------------------------------------
// Load related posts
// ------------------------------------------------------------
function loadRelated(relatedIds) {
  if (!relatedIds || !relatedIds.length) return;

  fetch(INDEX_URL + '?v=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.posts) return;

      var relatedPosts = data.posts.filter(function (p) {
        return relatedIds.indexOf(p.id) !== -1;
      });

      if (!relatedPosts.length) return;

      var section = document.getElementById('relatedSection');
      if (!section) return;

      var html = '<div class="related-section">';
      html += '<div class="related-title">Related Posts</div>';
      html += '<div class="related-grid">';

      relatedPosts.forEach(function (p) {
        html += '<a class="related-card" href="post.html?id=' +
                encodeURIComponent(p.id) + '">' +
                escapeHtml(p.title || 'Untitled') + '</a>';
      });

      html += '</div></div>';
      section.innerHTML = html;
    })
    .catch(function () {});
}

// ------------------------------------------------------------
// Error state
// ------------------------------------------------------------
function showError(msg) {
  var wrap = document.getElementById('articleWrap');
  wrap.innerHTML =
    '<div class="state-wrap">' +
    '<span class="state-icon">⚠</span>' +
    '<div class="state-title">Post not found</div>' +
    '<div class="state-sub">' + escapeHtml(msg) + '</div>' +
    '<a href="posts.html" class="state-btn">Back to Blog</a>' +
    '</div>';
}

// ------------------------------------------------------------
// Boot
// ------------------------------------------------------------
loadPost();
</script>

</body>
</html>
